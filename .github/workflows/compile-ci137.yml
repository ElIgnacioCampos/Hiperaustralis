name: CI137 historical Items - isolated native roundtrip

on:
  push:
    branches:
      - work/ci137-ensayo-identidad-historica-20261121
    paths:
      - '.github/workflows/compile-ci137.yml'
      - 'tools/foundry/ci137_pipeline.py'
      - 'tools/foundry/ci137_template_gate.py'
      - 'tools/foundry/assert_single_compendium.py'
      - 'manifests/ci137-selected-source-137-historical-ids.json'
      - 'manifests/ci137-parafernalia22-rituales8-recovery.json'
      - 'source/items/**'
      - 'source-pending/**'
      - 'source-original/foundry-templates/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  historical-items-137:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate CI137 Python and macro syntax
        run: |
          python -m py_compile tools/foundry/ci137_pipeline.py tools/foundry/assert_single_compendium.py tools/foundry/ci137_template_gate.py tools/foundry/ci137_equipo_20_transfer.py
          python tools/foundry/assert_single_compendium.py --self-test
      - name: Prepare exactly 136 selected real sources - no asset changes
        run: python tools/foundry/ci137_pipeline.py prepare --out "$RUNNER_TEMP/ci137-prepared"
      - name: Static CSB template compatibility — evidence only, never runtime approval
        run: |
          python tools/foundry/ci137_template_gate.py \
            --repo . --prepared "$RUNNER_TEMP/ci137-prepared"
      - name: Install official Foundry CLI 3.0.5
        run: npm install --no-audit --no-fund --no-save --no-package-lock @foundryvtt/foundryvtt-cli@3.0.5
      - name: Compile and unpack isolated 136 Item native pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci137-packs" "$RUNNER_TEMP/ci137-unpacked"
          ./node_modules/.bin/fvtt package pack -n ha-proto-items \
            --inputDirectory "$RUNNER_TEMP/ci137-prepared/items" \
            --outputDirectory "$RUNNER_TEMP/ci137-packs" --recursive
          ./node_modules/.bin/fvtt package unpack -n ha-proto-items \
            --inputDirectory "$RUNNER_TEMP/ci137-packs" \
            --outputDirectory "$RUNNER_TEMP/ci137-unpacked" --folders
      - name: Verify 136 identities, 9 folders and semantic fields
        run: |
          python tools/foundry/ci137_pipeline.py verify \
            --prepared "$RUNNER_TEMP/ci137-prepared" \
            --unpacked "$RUNNER_TEMP/ci137-unpacked"
      - name: CI137 release gate — do not produce installable ZIP while dependencies are open
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          pre = json.loads((temp / "ci137-prepared/ci137-preflight.json").read_text(encoding="utf-8"))
          rt = json.loads((temp / "ci137-prepared/ci137-roundtrip.json").read_text(encoding="utf-8"))
          refs = pre["legacyAssetReferences"]
          unique_paths = {r["path"] for r in refs}
          templates = {r["template"] for r in pre["records"]}
          assert pre["count"] == rt["items"] == 136
          assert pre["folders"] == rt["folders"] == 9
          extra = pre["additionalApprovedAssetRemaps"]
          assert len(refs) + len(extra) == 105 and len(templates) == 5
          assert len(unique_paths) + pre["additionalApprovedAssetCount"] == 78
          assert pre["additionalApprovedAssetCount"] == rt["additionalApprovedAssetCount"]
          assert len(extra) == rt["additionalApprovedAssetRemaps"]
          assert len({x["id"] for x in extra}) == pre["additionalApprovedAssetCount"]
          assert all(x["to"].startswith("modules/hiperaustralis-compendios-prototype/assets/") for x in extra)
          assert len(pre["sharedKnifeRemaps"]) == 2 and pre["sharedKnifeAssetCount"] == 1
          assert pre["approvedAssetCount"] == 16
          assert len(pre["approvedRemaps"]) == 32
          assert len(pre["historicalStagingAssets"]) == pre["historicalStagingVerifiedCount"] == rt["archivalWebpsVerified"] == 79
          assert pre["historicalStagingShaMatched"] == rt["archivalWebpsShaCompared"] == 30
          assert pre["historicalStagingPromotedCount"] == rt["archivalWebpsPromoted"] == 0
          assert len({x["stagedPath"] for x in pre["historicalStagingAssets"]}) == 79
          assert all(x["promotionAuthorized"] is False for x in pre["historicalStagingAssets"])
          assert pre["parafernaliaRitualesCrosswalk"] == rt["parafernaliaRitualesCrosswalk"]
          pr = pre["parafernaliaRitualesCrosswalk"]
          assert (pr["items"], pr["parafernalia"], pr["rituales"], pr["historicShaMatches"], pr["ritualBackgroundMatches"], pr["inventory075RitualPresence"], pr["archive075ByteParity"], pr["approvedRemaps"]) == (30, 22, 8, 30, 8, 8, False, 0)
          assert pre["defensasInstrumentosCrosswalk"] == rt["defensasInstrumentosCrosswalk"]
          cross = pre["defensasInstrumentosCrosswalk"]
          assert (cross["itemsAudited"], cross["uniqueNamedCandidates"], cross["ambiguous"], cross["withoutIdenticalArt"], cross["comApprovedWebpsSha256Verified"], cross["approvedItemRemaps"]) == (29, 17, 8, 4, 8, 0)
          result = {
            "schema": "ci137-release-gate-v01",
            "id": "hiperaustralis-compendios-prototype",
            "pack": "ha-proto-items",
            "D2": "ROUNDTRIP_PASS",
            "itemCount": 136,
            "legacyImageRefs": len(refs),
            "additionalApprovedAssetRemaps": len(extra),
            "legacyUniquePaths": len(unique_paths),
            "historicalWebpsPhysicallyAudited": pre["historicalStagingVerifiedCount"],
            "historicalWebpsShaMatched": pre["historicalStagingShaMatched"],
            "historicalWebpsPromoted": 0,
            "defensasInstrumentosEditorialCrosswalk": cross,
            "parafernaliaRitualesCrosswalk": pr,
            "csbTemplateIdsReferenced": sorted(templates),
            "D3": "FAILED_OR_UNVERIFIED",
            "installableArtifactProduced": False,
            "releaseDecision": "BLOCKED",
            "reason": str(len(refs)) + " unresolved historic image references; 5 CSB templates require real-world QA; the prior CI137 installer coincided with a world-load stall",
            "nextStep": "Resolve approved asset dependencies and reproduce Foundry client loading before any packaging"
          }
          (temp / "ci137-prepared/ci137-release-gate.json").write_text(
            json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False))
          PY
      - name: Preserve isolated audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci137-real-136-preflight-and-roundtrip
          path: |
            ${{ runner.temp }}/ci137-prepared/ci137-*.json
            ${{ runner.temp }}/ci137-prepared/assets/**
            ${{ runner.temp }}/ci137-packs/ha-proto-items/**
          if-no-files-found: warn
          retention-days: 30

# This workflow does NOT modify main, published packs, Foundry world, Forge,
# MELIAZ Bridge, item sources, or image binaries. No prerelease or deployment.
