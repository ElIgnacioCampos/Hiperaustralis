name: CI137 historical Items - isolated native roundtrip

on:
  push:
    branches:
      - work/ci137-ensayo-identidad-historica-20261121
    paths:
      - '.github/workflows/compile-ci137.yml'
      - 'tools/foundry/ci137_pipeline.py'
      - 'tools/foundry/ci137_template_gate.py'
      - 'tools/foundry/assert_single_compendium.py'
      - 'manifests/ci137-selected-source-137-historical-ids.json'
      - 'manifests/ci137-parafernalia22-rituales8-recovery.json'
      - 'source/items/**'
      - 'source-pending/**'
      - 'source-original/foundry-templates/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  historical-items-137:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate CI137 Python and macro syntax
        run: |
          python -m py_compile tools/foundry/ci137_pipeline.py tools/foundry/assert_single_compendium.py tools/foundry/ci137_template_gate.py tools/foundry/ci137_equipo_20_transfer.py
          python tools/foundry/assert_single_compendium.py --self-test
          python - <<'PY'
          # Synthetic-only proof of approval gate; no Item/asset persisted or published.
          import copy
          import hashlib
          import importlib.util
          import json
          import tempfile
          from pathlib import Path

          script = Path("tools/foundry/ci137_pipeline.py")
          spec = importlib.util.spec_from_file_location("ci137_pipeline", script)
          ci = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ci)
          entries = json.loads(Path("manifests/ci137-selected-source-137-historical-ids.json").read_text(encoding="utf-8"))["entries"]
          already_approved = [r for r in entries if r.get("approvedAssetTransport")]
          assert len(already_approved) == 6
          with tempfile.TemporaryDirectory() as isolated:
              verified = ci.verified_additional_approved_asset_remaps(entries, Path(isolated))
              assert set(verified) == {r["id"] for r in already_approved}
              for item in already_approved:
                  image = Path(isolated) / item["approvedAssetTransport"]["targetMember"]
                  assert image.is_file()
                  assert hashlib.sha256(image.read_bytes()).hexdigest() == item["approvedAssetTransport"]["sha256"]
          row = copy.deepcopy(next(r for r in entries if r["id"] == "1dhUgcpr5U3wAQ1l"))
          original = json.loads(Path(row["source"]).read_text(encoding="utf-8"))
          input_path = "source-original/ci137-asset-staging/instrumentos-erh/webp_256/kakel_kultrung_ERH_256.webp"
          source_bytes = Path(input_path).read_bytes()
          approved = {
              "status": "FINAL_ART_APPROVED_FOR_CI137",
              "visualIdentityApproved": True,
              "approvedForTransport": True,
              "approvalReference": "SYNTHETIC_TEST_ONLY_NOT_EDITORIAL_APPROVAL",
              "originalImg": original["img"],
              "sourcePath": input_path,
              "targetMember": "assets/instrumentos/CI137_SYNTHETIC_PROBE.webp",
              "sha256": hashlib.sha256(source_bytes).hexdigest(),
              "updateBackground": original.get("flags", {}).get("hiperaustralis-sheet", {}).get("background") == original["img"],
          }
          row["approvedAssetTransport"] = approved
          with tempfile.TemporaryDirectory() as temp_dir:
              output = Path(temp_dir)
              mapped = ci.verified_additional_approved_asset_remaps([row], output)
              assert mapped[row["id"]]["sha256"] == approved["sha256"]
              assert (output / approved["targetMember"]).read_bytes() == source_bytes
              for key, wrong in (("visualIdentityApproved", False), ("sha256", "0" * 64)):
                  bad = copy.deepcopy(row)
                  bad["approvedAssetTransport"][key] = wrong
                  try:
                      ci.verified_additional_approved_asset_remaps([bad], output)
                  except ValueError as err:
                      assert "CI137_BLOCKED" in str(err)
                  else:
                      raise AssertionError("unapproved/modified image was accepted: " + key)
          print("CI137 synthetic approval gate: positive + rejection cases PASS; actual approved remaps: 0")
          PY
      - name: Recover six previously approved ERH visual identities by exact seedId and SHA
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          selected=json.loads(Path("manifests/ci137-selected-source-137-historical-ids.json").read_text(encoding="utf-8"))["entries"]
          byid={r["id"]:r for r in selected}
          approved={
              "K7d2oqF6P7DB0Kpt":"inst-01-kultrung",
              "IG8DW7Wr30mg1jqx":"inst-02-pifullka",
              "gp4b3XE6mJGvqE9X":"inst-03-waza",
              "KpK5mqDdleRnemjh":"inst-13-piloilo",
              "vr5gUbTNMU8tj3zL":"inst-14-kaskawilla",
              "JZUzx0bNMoDj6xs5":"inst-16-pututu"
          }
          report=[]
          for id,seed in approved.items():
              row=byid[id]
              doc=json.loads(Path(row["source"]).read_text(encoding="utf-8"))
              assert doc["_id"]==id
              assert doc.get("flags",{}).get("hiperaustralis-instrumentos",{}).get("seedId")==seed
              assert doc["name"] and row["family"]=="Instrumentos musicales"
              p=row["editorialCrosswalk"]["candidateStagedPath"]
              assert p.startswith("source-original/ci137-asset-staging/instrumentos-erh/webp_256/")
              raw=Path(p).read_bytes()
              blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert blob==row["editorialCrosswalk"]["expectedGitBlobSha1"]
              assert len(raw)==row["editorialCrosswalk"]["expectedBytes"]
              assert raw[:4]==b"RIFF" and raw[8:12]==b"WEBP"
              report.append({"id":id,"seedId":seed,"path":p,"gitBlob":blob,
                             "sha256":hashlib.sha256(raw).hexdigest(),"bytes":len(raw)})
          assert len(report)==6
          approved_rows=[r for r in selected if r.get("approvedAssetTransport")]
          assert len(approved_rows)==6
          for row in approved_rows:
              match=next(r for r in report if r["id"]==row["id"])
              assert row["approvedAssetTransport"]["sha256"]==match["sha256"]
              assert row["approvedAssetTransport"]["sourcePath"]==match["path"]
              assert row["approvedAssetTransport"]["historicalSeedId"]==match["seedId"]
          print("CI137_ERH6_SHA256_JSON="+json.dumps(report,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Assert module contains no archival staging assets
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime = sorted(Path("module/assets").rglob("*.webp"))
          archive = sorted(Path("source-original/ci137-asset-staging").rglob("*.webp"))
          assert not Path("module/assets/_staging").exists()
          assert len(runtime) == 44, len(runtime)
          assert len(archive) == 148, len(archive)
          assert sum(p.stat().st_size for p in archive) == 6654130
          print({"runtimeWebps":44, "archivedWebps":148, "archivedBytes":6654130})
          PY
      - name: Prepare exactly 136 selected real sources - no asset changes
        run: python tools/foundry/ci137_pipeline.py prepare --out "$RUNNER_TEMP/ci137-prepared"
      - name: Static CSB template compatibility — evidence only, never runtime approval
        run: |
          python tools/foundry/ci137_template_gate.py \
            --repo . --prepared "$RUNNER_TEMP/ci137-prepared"
      - name: Install official Foundry CLI 3.0.5
        run: npm install --no-audit --no-fund --no-save --no-package-lock @foundryvtt/foundryvtt-cli@3.0.5
      - name: Compile and unpack isolated 136 Item native pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci137-packs" "$RUNNER_TEMP/ci137-unpacked"
          ./node_modules/.bin/fvtt package pack -n ha-proto-items \
            --inputDirectory "$RUNNER_TEMP/ci137-prepared/items" \
            --outputDirectory "$RUNNER_TEMP/ci137-packs" --recursive
          ./node_modules/.bin/fvtt package unpack -n ha-proto-items \
            --inputDirectory "$RUNNER_TEMP/ci137-packs" \
            --outputDirectory "$RUNNER_TEMP/ci137-unpacked" --folders
      - name: Verify 136 identities, 9 folders and semantic fields
        run: |
          python tools/foundry/ci137_pipeline.py verify \
            --prepared "$RUNNER_TEMP/ci137-prepared" \
            --unpacked "$RUNNER_TEMP/ci137-unpacked"
      - name: CI137 release gate — do not produce installable ZIP while dependencies are open
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          pre = json.loads((temp / "ci137-prepared/ci137-preflight.json").read_text(encoding="utf-8"))
          rt = json.loads((temp / "ci137-prepared/ci137-roundtrip.json").read_text(encoding="utf-8"))
          refs = pre["legacyAssetReferences"]
          unique_paths = {r["path"] for r in refs}
          templates = {r["template"] for r in pre["records"]}
          assert pre["count"] == rt["items"] == 136
          assert pre["folders"] == rt["folders"] == 9
          extra = pre["additionalApprovedAssetRemaps"]
          assert len(refs) + len(extra) == 105 and len(templates) == 5
          assert len(unique_paths) + pre["additionalApprovedAssetCount"] == 78
          assert pre["additionalApprovedAssetCount"] == rt["additionalApprovedAssetCount"]
          assert len(extra) == rt["additionalApprovedAssetRemaps"]
          assert len({x["id"] for x in extra}) == pre["additionalApprovedAssetCount"]
          assert all(x["to"].startswith("modules/hiperaustralis-compendios-prototype/assets/") for x in extra)
          assert len(pre["sharedKnifeRemaps"]) == 2 and pre["sharedKnifeAssetCount"] == 1
          assert pre["approvedAssetCount"] == 16
          assert len(pre["approvedRemaps"]) == 32
          assert len(pre["historicalStagingAssets"]) == pre["historicalStagingVerifiedCount"] == rt["archivalWebpsVerified"] == 79
          assert pre["historicalStagingShaMatched"] == rt["archivalWebpsShaCompared"] == 30
          assert pre["historicalStagingPromotedCount"] == rt["archivalWebpsPromoted"] == 0
          assert len({x["stagedPath"] for x in pre["historicalStagingAssets"]}) == 79
          assert all(x["promotionAuthorized"] is False for x in pre["historicalStagingAssets"])
          assert pre["parafernaliaRitualesCrosswalk"] == rt["parafernaliaRitualesCrosswalk"]
          pr = pre["parafernaliaRitualesCrosswalk"]
          assert (pr["items"], pr["parafernalia"], pr["rituales"], pr["historicShaMatches"], pr["ritualBackgroundMatches"], pr["inventory075RitualPresence"], pr["archive075ByteParity"], pr["approvedRemaps"]) == (30, 22, 8, 30, 8, 8, False, 0)
          assert pre["defensasInstrumentosCrosswalk"] == rt["defensasInstrumentosCrosswalk"]
          cross = pre["defensasInstrumentosCrosswalk"]
          assert (cross["itemsAudited"], cross["uniqueNamedCandidates"], cross["approvedERHSeedMatches"], cross["namedCandidatesRemaining"], cross["ambiguous"], cross["withoutIdenticalArt"], cross["comApprovedWebpsSha256Verified"], cross["approvedItemRemaps"]) == (29, 17, 6, 11, 8, 4, 8, 6)
          assert pre["additionalApprovedAssetCount"] == 6
          assert len(refs) == 99 and len(unique_paths) == 72
          result = {
            "schema": "ci137-release-gate-v01",
            "id": "hiperaustralis-compendios-prototype",
            "pack": "ha-proto-items",
            "D2": "ROUNDTRIP_PASS",
            "itemCount": 136,
            "legacyImageRefs": len(refs),
            "additionalApprovedAssetRemaps": len(extra),
            "legacyUniquePaths": len(unique_paths),
            "historicalWebpsPhysicallyAudited": pre["historicalStagingVerifiedCount"],
            "historicalWebpsShaMatched": pre["historicalStagingShaMatched"],
            "historicalWebpsPromoted": 0,
            "defensasInstrumentosEditorialCrosswalk": cross,
            "parafernaliaRitualesCrosswalk": pr,
            "csbTemplateIdsReferenced": sorted(templates),
            "D3": "FAILED_OR_UNVERIFIED",
            "installableArtifactProduced": False,
            "releaseDecision": "BLOCKED",
            "reason": str(len(refs)) + " unresolved historic image references; 5 CSB templates require real-world QA; the prior CI137 installer coincided with a world-load stall",
            "nextStep": "Resolve approved asset dependencies and reproduce Foundry client loading before any packaging"
          }
          (temp / "ci137-prepared/ci137-release-gate.json").write_text(
            json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False))
          PY
      - name: Preserve isolated audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci137-real-136-preflight-and-roundtrip
          path: |
            ${{ runner.temp }}/ci137-prepared/ci137-*.json
            ${{ runner.temp }}/ci137-prepared/assets/**
            ${{ runner.temp }}/ci137-packs/ha-proto-items/**
          if-no-files-found: warn
          retention-days: 30

# This workflow does NOT modify main, published packs, Foundry world, Forge,
# MELIAZ Bridge, item sources, or image binaries. No prerelease or deployment.
