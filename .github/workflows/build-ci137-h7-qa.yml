name: CI137 H7 candidate QA ZIP - isolated, never deploy

on:
  push:
    branches:
      - work/ci137-ensayo-identidad-historica-20261121
    paths:
      - '.github/workflows/build-ci137-h7-qa.yml'
      - 'tools/foundry/ci137_h7_packager.py'
      - 'tools/foundry/ci137_h7_readonly.js'
      - 'tools/foundry/ci137_pipeline.py'
      - 'manifests/ci137-selected-source-137-historical-ids.json'
      - 'manifests/ci137-parafernalia22-rituales8-recovery.json'
      - 'source/**'
      - 'source-pending/**'
      - 'module/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-h7-qa-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python and JS syntax gate
        run: |
          set -euo pipefail
          python -m py_compile tools/foundry/ci137_pipeline.py tools/foundry/ci137_h7_packager.py
          node --check tools/foundry/ci137_h7_readonly.js
      - name: Reconstruct precisely 136 historical Items, no asset promotions
        run: |
          set -euo pipefail
          python tools/foundry/ci137_pipeline.py prepare --out "$RUNNER_TEMP/ci137-prepared"
      - name: Recover existing versioned Actor and Journal baseline
        run: |
          set -euo pipefail
          python tools/foundry/ci137_h7_packager.py prepare-meta --out "$RUNNER_TEMP/ci137-meta"
      - name: Install official Foundry CLI
        run: npm install --no-audit --no-fund --no-save --no-package-lock @foundryvtt/foundryvtt-cli@3.0.5
      - name: Compile three existing module packs, no world changes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci137-packs" "$RUNNER_TEMP/ci137-unpacked"
          FVTT="./node_modules/.bin/fvtt"
          "$FVTT" package pack -n ha-proto-items --inputDirectory "$RUNNER_TEMP/ci137-prepared/items" --outputDirectory "$RUNNER_TEMP/ci137-packs" --recursive
          "$FVTT" package pack -n ha-proto-actors --inputDirectory "$RUNNER_TEMP/ci137-meta/actors" --outputDirectory "$RUNNER_TEMP/ci137-packs"
          "$FVTT" package pack -n ha-proto-journals --inputDirectory "$RUNNER_TEMP/ci137-meta/journals" --outputDirectory "$RUNNER_TEMP/ci137-packs"
          "$FVTT" package unpack -n ha-proto-items --inputDirectory "$RUNNER_TEMP/ci137-packs" --outputDirectory "$RUNNER_TEMP/ci137-unpacked" --folders
          python tools/foundry/ci137_pipeline.py verify --prepared "$RUNNER_TEMP/ci137-prepared" --unpacked "$RUNNER_TEMP/ci137-unpacked"
      - name: Build QA-only module ZIP; no hooks, installers or publishing
        run: |
          set -euo pipefail
          python tools/foundry/ci137_h7_packager.py assemble \
            --prepared "$RUNNER_TEMP/ci137-prepared" \
            --packs "$RUNNER_TEMP/ci137-packs" \
            --out "dist/HIPERA7_CI137_QA_136_NO_PUBLICAR_v01.zip"
          unzip -t "dist/HIPERA7_CI137_QA_136_NO_PUBLICAR_v01.zip"
          sha256sum "dist/HIPERA7_CI137_QA_136_NO_PUBLICAR_v01.zip" > "dist/SHA256.txt"
      - name: Enforce installation gate remains CLOSED
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("dist/CI137_H7_QA_BUILD_MANIFEST.json").read_text())
          assert manifest["items"]==136
          assert manifest["packs"]==["ha-proto-items","ha-proto-actors","ha-proto-journals"]
          assert manifest["legacyReferencesUnresolved"]==99
          assert manifest["autoInstallOrMigration"] is False
          assert manifest["published"] is False
          assert manifest["foundryClientD3Approved"] is False
          assert manifest["replaceExistingPrototypeInForgeGlobally"] is True
          print("CI137 H7 candidate PASS; D3/distribution gate remains BLOCKED")
          PY
      - uses: actions/upload-artifact@v4
        name: CI137-H7-136-ISOLATED-QA-NO-PUBLICAR
        with:
          name: CI137-H7-136-ISOLATED-QA-NO-PUBLICAR
          path: dist/*
          if-no-files-found: error
          retention-days: 30

# No gh release, merge, deployment, Foundry mutation, Forge upload, or Estado Maestro edit.
