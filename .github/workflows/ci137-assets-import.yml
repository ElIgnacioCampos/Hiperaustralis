name: CI137 transfer 115 verified image assets - no module install

on:
  push:
    branches:
      - work/ci137-ensayo-identidad-historica-20261121
    paths:
      - 'tools/foundry/ci137_assets_import.py'
      - '.github/workflows/ci137-assets-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isolated-ci137-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 11 Git blobs and import 115 assets (no Item or compendium edits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/foundry/ci137_assets_import.py
      - name: Commit only verified assets to existing CI137 branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- module/assets/
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert len(files) in (0, 115), f'Unexpected staged count: {len(files)}'
          assert all(x.startswith('module/assets/') and x.endswith('.webp') for x in files), files
          print({'stagedWebP':len(files),'noItemsOrPacks':True})
          PY
          if git diff --cached --quiet; then
            echo 'Already integrated byte-identically; no commit required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'assets(ci137): integrar 36 aprobados y 79 historicos en staging sin modificar Items'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Preserve read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci137-assets-binary-transfer-report
          path: ${{ runner.temp }}/ci137-assets-import-report.json
          if-no-files-found: warn
          retention-days: 30
