name: Compile Hiperaustralis native compendia

on:
  push:
    branches: [work/native-compendia-pipeline]
    paths:
      - '.github/workflows/compile-native-packs.yml'
      - 'source/**'
      - 'module/**'
      - 'validate_*.py'
      - 'prepare_sources.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-node@v4
        name: Set up Node.js
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: '3.x'
      - name: Restore compressed 21-page JournalEntry source
        run: |
          set -euo pipefail
          base64 -d source/journals/01_auspicios_hiperaustralis.json.gz.b64 | gzip -dc > source/journals/01_auspicios_hiperaustralis.json
          python -m json.tool source/journals/01_auspicios_hiperaustralis.json >/dev/null
      - name: Install official Foundry CLI
        run: npm install --no-audit --no-fund --no-save --no-package-lock @foundryvtt/foundryvtt-cli@3.0.5
      - name: Validate canonical sources
        run: python validate_sources.py
      - name: Prepare CLI transport fields
        run: python prepare_sources.py "$RUNNER_TEMP/pack-source"
      - name: Compile, unpack and validate native packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p module/packs
          rm -rf module/packs/ha-proto-items module/packs/ha-proto-actors module/packs/ha-proto-journals
          VERIFY="$RUNNER_TEMP/verify"
          mkdir -p "$VERIFY"
          FVTT="./node_modules/.bin/fvtt"
          "$FVTT" package pack -n ha-proto-items --inputDirectory "$RUNNER_TEMP/pack-source/items" --outputDirectory module/packs
          "$FVTT" package pack -n ha-proto-actors --inputDirectory "$RUNNER_TEMP/pack-source/actors" --outputDirectory module/packs
          "$FVTT" package pack -n ha-proto-journals --inputDirectory "$RUNNER_TEMP/pack-source/journals" --outputDirectory module/packs
          for pack in ha-proto-items ha-proto-actors ha-proto-journals; do
            test -d "module/packs/$pack"
            test -n "$(find "module/packs/$pack" -type f -size +0c -print -quit)"
            "$FVTT" package unpack -n "$pack" --inputDirectory module/packs --outputDirectory "$VERIFY/$pack"
          done
          python validate_compiled.py "$VERIFY"
      - name: Build and verify Forge ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          cd module
          zip -qr ../dist/HIPERAUSTRALIS_COMPENDIOS_PROTO_NATIVO_v0.1.5.zip .
          cd ..
          unzip -t dist/HIPERAUSTRALIS_COMPENDIOS_PROTO_NATIVO_v0.1.5.zip
          unzip -l dist/HIPERAUSTRALIS_COMPENDIOS_PROTO_NATIVO_v0.1.5.zip | grep -q 'module.json'
          sha256sum dist/HIPERAUSTRALIS_COMPENDIOS_PROTO_NATIVO_v0.1.5.zip > dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        name: Publish compiled artifact
        with:
          name: HIPERAUSTRALIS_COMPENDIOS_PROTO_NATIVO_v0.1.5
          path: dist/*
          if-no-files-found: error
      - name: Publish Forge test prerelease
        if: contains(github.event.head_commit.message, '[publish-test]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.5-forge-test dist/HIPERAUSTRALIS_COMPENDIOS_PROTO_NATIVO_v0.1.5.zip --prerelease --title "Hiperaustralis Compendios v0.1.5 · Prueba Forge" --notes "Distribución de prueba aislada. No reemplaza hiperaustralis-rituales. Foundry 14.367; requiere Custom System Builder 6.0.0 o superior."
