name: CI137 — Forge Wizard Hipera 6 isolated QA module

on:
  push:
    branches:
      - work/ci137-ensayo-identidad-historica-20261121
    paths:
      - '.github/workflows/build-ci137-forge-hipera6.yml'
      - 'tools/foundry/build_ci137_forge_qa6.py'
      - 'tools/foundry/ci137_forge_qa6_readonly.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-forge-qa6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        shell: bash
        run: |
          python -m py_compile tools/foundry/build_ci137_forge_qa6.py tools/foundry/ci137_pipeline.py
          node --check tools/foundry/ci137_forge_qa6_readonly.js
      - name: Prepare validated CI137 sources (read only originals)
        run: python tools/foundry/ci137_pipeline.py prepare --out "${{ runner.temp }}/ci137-prepared"
      - name: Stage independent Hipera 6 module and normalize only module-local URLs
        run: |
          python tools/foundry/build_ci137_forge_qa6.py \
            --prepared "${{ runner.temp }}/ci137-prepared" \
            --module-out "${{ runner.temp }}/forge-build/hiperaustralis-ci137-qa6"
      - name: Install official Foundry CLI 3.0.5
        run: npm install --no-audit --no-fund --no-save --no-package-lock @foundryvtt/foundryvtt-cli@3.0.5
      - name: Compile QA6 module pack
        shell: bash
        run: |
          set -euo pipefail
          MOD="${{ runner.temp }}/forge-build/hiperaustralis-ci137-qa6"
          mkdir -p "$MOD/packs" "${{ runner.temp }}/ci137-qa6-unpacked"
          ./node_modules/.bin/fvtt package pack -n ha-proto-items \
            --inputDirectory "$MOD/items" \
            --outputDirectory "$MOD/packs" --recursive
          ./node_modules/.bin/fvtt package unpack -n ha-proto-items \
            --inputDirectory "$MOD/packs" \
            --outputDirectory "${{ runner.temp }}/ci137-qa6-unpacked" --folders
          # Verify against the rewritten isolated transport, not the historic original URLs.
          cp "${{ runner.temp }}/ci137-prepared/ci137-preflight.json" "$MOD/ci137-preflight.json"
          python tools/foundry/ci137_pipeline.py verify \
            --prepared "$MOD" \
            --unpacked "${{ runner.temp }}/ci137-qa6-unpacked"
          rm -rf "$MOD/items" "$MOD/ci137-preflight.json"
      - name: ZIP Forge Wizard package, module manifest in ZIP root
        shell: bash
        run: |
          set -euo pipefail
          MOD="${{ runner.temp }}/forge-build/hiperaustralis-ci137-qa6"
          test -f "$MOD/module.json"
          test -f "$MOD/packs/ha-proto-items/CURRENT"
          test -f "$MOD/QA/CI137_FORGE_HIPERA6_SOLO_LECTURA.js"
          test "$(find "$MOD/assets" -type f -name '*.webp' | wc -l)" -eq 17
          (cd "$MOD" && zip -q -r "${{ runner.temp }}/HIPERA_CI137_FORGE_HIPERA6_WIZARD_v01.zip" .)
          unzip -t "${{ runner.temp }}/HIPERA_CI137_FORGE_HIPERA6_WIZARD_v01.zip" | tail -1
          unzip -p "${{ runner.temp }}/HIPERA_CI137_FORGE_HIPERA6_WIZARD_v01.zip" module.json | python -c 'import sys,json; o=json.load(sys.stdin); assert o["id"]=="hiperaustralis-ci137-qa6"; assert len(o["packs"])==1'
          sha256sum "${{ runner.temp }}/HIPERA_CI137_FORGE_HIPERA6_WIZARD_v01.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: HIPERA_CI137_FORGE_HIPERA6_WIZARD_v01
          path: ${{ runner.temp }}/HIPERA_CI137_FORGE_HIPERA6_WIZARD_v01.zip
          if-no-files-found: error
          retention-days: 30

# No release, no merge, no deployment, no user-world changes, no image generation.
