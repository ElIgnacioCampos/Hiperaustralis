name: CI137 - Recover and preserve native release sources
on:
  push:
    branches: [work/ci137-expansion-familias-20261124]
    paths: ['.github/workflows/ci137-recover-native-release-documents.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact historical sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ha-source" "$RUNNER_TEMP/ha-native" recovery
          gh release download Hiperaustralis --repo "$GITHUB_REPOSITORY" --pattern HIPERAUSTRALIS_COMPENDIOS_v1.0.0_FORGE.zip --dir "$RUNNER_TEMP/ha-source"
          gh release download Turianos --repo "$GITHUB_REPOSITORY" --pattern HIPERAUSTRALIS_RIVALES_TURIANOS_INTEGRACION_NATIVA_v06.zip --dir "$RUNNER_TEMP/ha-source"
          python - <<'PY'
          import hashlib, zipfile, os, shutil
          from pathlib import Path, PurePosixPath
          temp=Path(os.environ['RUNNER_TEMP'])
          sources={
            'HIPERAUSTRALIS_COMPENDIOS_v1.0.0_FORGE.zip':'ca610ae5cfb81d01a925af6fa2fcb03e942e9c4432530bfb3a711c8d0525a86a',
            'HIPERAUSTRALIS_RIVALES_TURIANOS_INTEGRACION_NATIVA_v06.zip':'5880d34b0d614f3e7ec734f4a59fa88fe8b3264505c0bceed1302eeb71b15a15'}
          for n,digest in sources.items():
              f=temp/'ha-source'/n
              assert hashlib.sha256(f.read_bytes()).hexdigest()==digest
              with zipfile.ZipFile(f) as z:
                  assert z.testzip() is None
                  for i in z.infolist():
                      p=PurePosixPath(i.filename)
                      assert not p.is_absolute() and '..' not in p.parts
                      if i.is_dir(): continue
                      if n.startswith('HIPERAUSTRALIS_COMPENDIOS'):
                          if p.parts[0]=='packs':
                              assert len(p.parts)>2
                              target=temp/'ha-native'/Path(*p.parts)
                          elif p.name in ('BUILD_MANIFEST.json','module.json','ESTADO_TURIANOS.md'):
                              target=Path('recovery/v100-meta')/p.name
                          else: continue
                      else:
                          if 'ACTORES_JSON' in p.parts and p.suffix=='.json':
                              target=Path('recovery/turianos-v06')/p.name
                          elif p.name in ('AUDITORIA_INTEGRACION.json','MANIFIESTO.json','FICHAS_RIVALES.md','LEEME_INSTALACION.md'):
                              target=Path('recovery/turianos-v06-meta')/p.name
                          else: continue
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(z.read(i))
          assert len(list(Path('recovery/turianos-v06').glob('*.json')))==6
          PY
      - name: Install pinned Foundry CLI
        run: npm install --no-audit --no-fund --no-save --no-package-lock @foundryvtt/foundryvtt-cli@3.0.5
      - name: Recover native documents without loading module or scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/native
          : > recovery/unpack-status.tsv
          for pack in hiperaustralis-bestiario hiperaustralis-adversarios-mapuche hiperaustralis-journals territorio hiperaustralis-naturaleza-items; do
            mkdir -p "recovery/native/$pack"
            if ./node_modules/.bin/fvtt package unpack -n "$pack" --inputDirectory "$RUNNER_TEMP/ha-native/packs" --outputDirectory "recovery/native/$pack" --folders; then
              printf '%s\tPASS\n' "$pack" >> recovery/unpack-status.tsv
            else
              printf '%s\tFAIL\n' "$pack" >> recovery/unpack-status.tsv
            fi
          done
      - name: Inventory recovered records, no runtime approval
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path('recovery')
          out={'status':'RECOVERY_ONLY_NOT_COMPILED','packs':{},'turianos':[]}
          for p in sorted((root/'native').iterdir()):
              rec=[]
              for f in sorted(p.rglob('*.json')):
                  d=json.loads(f.read_text())
                  if isinstance(d,dict):
                      rec.append({'file':str(f.relative_to(root)),'id':d.get('_id'),'name':d.get('name'),'type':d.get('type'),'pages':len(d.get('pages',[])),'img':d.get('img'),'folder':d.get('folder'),'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
              out['packs'][p.name]={'count':len(rec),'records':rec}
          for f in sorted((root/'turianos-v06').glob('*.json')):
              d=json.loads(f.read_text())
              out['turianos'].append({'file':f.name,'id':d.get('_id'),'name':d.get('name'),'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
          out['unpackStatus']=(root/'unpack-status.tsv').read_text()
          (root/'recovery-inventory.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'packs':{k:v['count'] for k,v in out['packs'].items()},'turianos':len(out['turianos']),'unpackStatus':out['unpackStatus']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CI137-NATIVE-RELEASE-RECOVERY-DOCUMENTS
          path: recovery/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve source JSON in isolated branch; no runtime changes
        if: github.ref == 'refs/heads/work/ci137-expansion-familias-20261124'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, os, zipfile
          from pathlib import Path
          src=Path('recovery')
          dst=Path('source-pending/ci137-native-release-recovered')
          inventory=json.loads((src/'recovery-inventory.json').read_text())
          expected={'hiperaustralis-bestiario':50,'hiperaustralis-adversarios-mapuche':21,'hiperaustralis-journals':6,'territorio':32,'hiperaustralis-naturaleza-items':101}
          assert {k:v['count'] for k,v in inventory['packs'].items()}==expected
          assert all(line.endswith('PASS') for line in inventory['unpackStatus'].splitlines())
          assert len(inventory['turianos'])==6
          selected=['native/hiperaustralis-journals','native/territorio','native/hiperaustralis-naturaleza-items','turianos-v06']
          def scrub(v):
              if isinstance(v,list): return [scrub(x) for x in v]
              if not isinstance(v,dict): return v
              out={}
              for k,x in v.items():
                  if k=='lastModifiedBy': continue
                  if k=='ownership' and isinstance(x,dict): out[k]={'default':x.get('default',0)}
                  else: out[k]=scrub(x)
              return out
          def sha(x): return hashlib.sha256(x).hexdigest()
          records=[]
          for sub in selected:
              for f in sorted((src/sub).rglob('*.json')):
                  raw=f.read_bytes()
                  d=scrub(json.loads(raw))
                  out=dst/f.relative_to(src)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  data=(json.dumps(d,ensure_ascii=False,indent=2)+'\n').encode()
                  if out.exists(): assert out.read_bytes()==data, str(out)
                  else: out.write_bytes(data)
                  records.append({'path':str(out),'originalSHA256':sha(raw),'stagedSHA256':sha(data),'id':d.get('_id'),'name':d.get('name'),'type':d.get('type')})
          assert len(records)==145
          temp=Path(os.environ['RUNNER_TEMP'])
          tur_zip=temp/'ha-source/HIPERAUSTRALIS_RIVALES_TURIANOS_INTEGRACION_NATIVA_v06.zip'
          with zipfile.ZipFile(tur_zip) as z:
              assets=[]
              for r in inventory['turianos']:
                  d=json.loads((src/'turianos-v06'/r['file']).read_text())
                  for kind,path in [('avatar',d['img']),('token',d['prototypeToken']['texture']['src'])]:
                      matches=[n for n in z.namelist() if n.endswith('/'+path)]
                      assert len(matches)==1, path
                      raw=z.read(matches[0])
                      assets.append({'actorId':r['id'],'kind':kind,'path':path,'archiveMember':matches[0],'sha256':sha(raw),'bytes':len(raw)})
          assert len(assets)==12
          manifest={'status':'ARCHIVAL_SOURCES_ONLY_NOT_RUNTIME_APPROVAL','sourceRun':45487311335,'sourceArtifact':14963828413,'sourceArchives':['Hiperaustralis v1.0.0','Turianos v06'],'transformations':['Remove per-user ownership and lastModifiedBy only; JSON reserialization'],'records':records,'turianoAssets':assets,'exclusions':['Four Atlante IDs excluded from active compilation; v100 Turiano aliases with those IDs not staged','Bestiario and Rivales already backed up by actor export','No PNG duplicated from public release; byte hashes and exact archive paths recorded'],'runtimeBlocked':True}
          (dst/'PROVENANCE.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- source-pending/ci137-native-release-recovered
          if ! git diff --cached --quiet; then
            git commit -m "CI137 preserve verified native historical sources and Turiano asset hashes (staging only)"
            git push origin HEAD:refs/heads/work/ci137-expansion-familias-20261124
          fi
